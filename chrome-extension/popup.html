<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <header>
        <h1>💼 Job Tracker</h1>
        <span id="connection-status" title="Statut du serveur">⚪ Déconnecté</span>
    </header>

    <main>
        <!-- Stats cards -->
        <section id="stats">
            <div class="stats-cards">
                <div class="stat-card" id="stat-total">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card" id="stat-a-postuler">
                    <span class="stat-value">0</span>
                    <span class="stat-label">À postuler</span>
                </div>
                <div class="stat-card" id="stat-postule">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Postulé</span>
                </div>
                <div class="stat-card" id="stat-entretien">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Entretien</span>
                </div>
                <div class="stat-card" id="stat-refus">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Refus</span>
                </div>
                <div class="stat-card" id="stat-accepte">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Accepté</span>
                </div>
            </div>
            <div id="progress-bar" class="progress-bar">
                <div class="progress-segment" id="progress-a-postuler"></div>
                <div class="progress-segment" id="progress-postule"></div>
                <div class="progress-segment" id="progress-entretien"></div>
                <div class="progress-segment" id="progress-refus"></div>
                <div class="progress-segment" id="progress-accepte"></div>
            </div>
        </section>

        <!-- Add application form -->
        <section id="form">
            <h2>Ajouter une candidature</h2>
            <form id="add-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="input-company">Entreprise</label>
                        <input type="text" id="input-company" name="company" required placeholder="Ex: Google" />
                    </div>
                    <div class="form-group">
                        <label for="input-title">Poste</label>
                        <input type="text" id="input-title" name="title" required placeholder="Ex: SWE Intern" />
                    </div>
                    <div class="form-group">
                        <label for="input-type">Type</label>
                        <input type="text" id="input-type" name="type" placeholder="Ex: CDI, Stage" />
                    </div>
                    <div class="form-group">
                        <label for="input-date">Date</label>
                        <input type="date" id="input-date" name="application_date" />
                    </div>
                    <div class="form-group">
                        <label for="input-status">Statut</label>
                        <select id="input-status" name="status">
                            <option value="À postuler">À postuler</option>
                            <option value="Postulé">Postulé</option>
                            <option value="Entretien">Entretien</option>
                            <option value="Refus">Refus</option>
                            <option value="Accepté">Accepté</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-link">Lien</label>
                        <input type="url" id="input-link" name="link" placeholder="https://..." />
                    </div>
                    <div class="form-group form-group-full">
                        <label for="input-notes">Notes</label>
                        <textarea id="input-notes" name="notes" rows="2" placeholder="Notes libres..."></textarea>
                    </div>
                </div>
                <button type="submit" id="btn-submit">+ Ajouter</button>
            </form>
        </section>

        <!-- Applications table -->
        <section id="table">
            <h2>Candidatures</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Entreprise</th>
                            <th>Poste</th>
                            <th>Type</th>
                            <th>Date</th>
                            <th>Statut</th>
                            <th>Lien</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected by popup.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <span id="footer-status">Serveur : non connecté</span>
    </footer>

    <script src="popup.js" defer></script>
</body>

</html>
