<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <header>
        <h1>💼 Job Tracker</h1>
        <span id="connection-status" title="Server Status">⚪ Disconnected</span>
    </header>

    <main>
        <!-- Stats cards -->
        <section id="stats">
            <div class="stats-cards">
                <div class="stat-card" id="stat-total">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card" id="stat-a-postuler">
                    <span class="stat-value">0</span>
                    <span class="stat-label">To Apply</span>
                </div>
                <div class="stat-card" id="stat-postule">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Applied</span>
                </div>
                <div class="stat-card" id="stat-entretien">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Interview</span>
                </div>
                <div class="stat-card" id="stat-refus">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Rejected</span>
                </div>
                <div class="stat-card" id="stat-accepte">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Accepted</span>
                </div>
            </div>
            <div id="progress-bar" class="progress-bar">
                <div class="progress-segment" id="progress-a-postuler"></div>
                <div class="progress-segment" id="progress-postule"></div>
                <div class="progress-segment" id="progress-entretien"></div>
                <div class="progress-segment" id="progress-refus"></div>
                <div class="progress-segment" id="progress-accepte"></div>
            </div>
        </section>

        <!-- Add application form -->
        <section id="form">
            <h2>Add Job Application</h2>
            <form id="add-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="input-company">Company</label>
                        <input type="text" id="input-company" name="company" required placeholder="Ex: Google" />
                    </div>
                    <div class="form-group">
                        <label for="input-title">Job Title</label>
                        <input type="text" id="input-title" name="title" required placeholder="Ex: SWE Intern" />
                    </div>
                    <div class="form-group">
                        <label for="input-type">Contract Type</label>
                        <input type="text" id="input-type" name="type" placeholder="Ex: Full-Time, Internship" />
                    </div>
                    <div class="form-group">
                        <label for="input-date">Date</label>
                        <input type="date" id="input-date" name="application_date" />
                    </div>
                    <div class="form-group">
                        <label for="input-status">Status</label>
                        <select id="input-status" name="status">
                            <option value="To Apply">To Apply</option>
                            <option value="Applied">Applied</option>
                            <option value="Interview">Interview</option>
                            <option value="Rejected">Rejected</option>
                            <option value="Accepted">Accepted</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-link">Job Link</label>
                        <input type="url" id="input-link" name="link" placeholder="https://..." />
                    </div>
                    <div class="form-group form-group-full">
                        <label for="input-notes">Notes</label>
                        <textarea id="input-notes" name="notes" rows="2" placeholder="Additional notes..."></textarea>
                    </div>
                </div>
                <button type="submit" id="btn-submit">+ Add Application</button>
            </form>
        </section>

        <!-- Applications table -->
        <section id="table">
            <h2>Applications</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Job Title</th>
                            <th>Type</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Link</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected by popup.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <span id="footer-status">Server: Disconnected</span>
    </footer>

    <script src="popup.js" defer></script>
</body>

</html>
