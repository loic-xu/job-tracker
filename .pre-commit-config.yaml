repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [pandas-stubs]
        
  - repo: local
    hooks:
      - id: pytest
        name: run unit tests
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
